# ============================================================
#  FWS Linux — modules/packages.conf
#  Paquets installés via pacman pendant l'installation
# ============================================================

# Gestionnaire de paquets
backend: pacman

# Ne pas mettre à jour la base de données pacman (déjà dans le live)
update_db: false

operations:
  - install:
      # Base système
      - base
      - base-devel
      - linux
      - linux-headers
      - linux-firmware

      # Bootloader
      - grub
      - efibootmgr
      - os-prober
      - mkinitcpio-openswap

      # Réseau
      - networkmanager
      - network-manager-applet
      - wpa_supplicant
      - dhcpcd

      # Outils essentiels
      - sudo
      - nano
      - vim
      - git
      - curl
      - wget
      - htop
      - bash-completion

      # Locale & timezone
      - tzdata

      # Optionnel — retire ce qui ne correspond pas à FWS
      - pipewire
      - pipewire-pulse
      - wireplumber

# Paquets à retirer du système live (pas nécessaires après install)
  # - remove:
      - calamares
      - calamares-config
