# ============================================================
#  FWS Linux — modules/services-systemd.conf
#  Services systemd activés sur le système installé
# ============================================================

services:
  # Réseau
  - name: NetworkManager
    mandatory: true

  # DHCP
  - name: dhcpcd
    mandatory: false

  # Heure synchronisée
  - name: systemd-timesyncd
    mandatory: true

  # Ajoute ici tes services FWS supplémentaires
  # - name: mon-service-fws
  #   mandatory: false

targets: []
